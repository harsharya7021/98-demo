<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>For Ambrosia — Campaign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Poppins:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="head.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
*{-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

/* ---------------------------------------------------------------------------
   These two pages are the speculative work made FOR Ambrosia, so they stop
   speaking in 98's carbon-and-red and speak in Ambrosia's own identity —
   near-black, blush, dusty rose, Cormorant Garamond over Poppins. The other
   three sections stay 98's. That contrast is the point: the client sees their
   brand already understood, on the pages that are about their brand.

   Every component below is written against --ink / --dim / --dimmer / --frame
   rather than literal colours, so the blush band further down re-themes the
   whole section by redefining four variables instead of duplicating rules.
--------------------------------------------------------------------------- */
:root{
  --noir:#1C1B1B;          /* Ambrosia near-black */
  --blush:#EFDCDD;         /* Ambrosia blush     */
  --rose:#B5677A;          /* Ambrosia dusty rose */
  --ink:#F2E7E7;           /* warm off-white, pulled off the blush — not pure white */
  --dim:rgba(242,231,231,.58);
  --dimmer:rgba(242,231,231,.18);
  --frame:#262424;         /* ground behind a loading image */
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Poppins",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace;
  --pad:64px;
}
html{scroll-behavior:smooth}
body{background:var(--noir);color:var(--ink);font-family:var(--sans);
  font-weight:300;line-height:1.5}
a{color:inherit}

/* the shared header component, re-tinted — head.css exposes these */
.sitehead{
  --hd-bg:rgba(28,27,27,.88);
  --hd-rule:rgba(242,231,231,.20);
  --hd-dim:rgba(242,231,231,.58);
  --hd-ink:var(--ink);
  --hd-hot:var(--rose);
}

/* one micro-label treatment, used everywhere small type appears */
.lbl,.mast .code,.piece .k,.piece .tag,.piece .more,.rule i,.pal span,
.rules b,.pager a,.hero .cap,.mosaic figcaption,.switch a,#lb .x{
  font-family:var(--sans);font-weight:500;letter-spacing:.18em;text-transform:uppercase}

/* The section bar already carries both campaigns, so the two-up switcher is a
   duplicate wherever that bar is showing. It takes over only below 1040px. */
.switch{display:none;gap:6px}
.switch a{padding:6px 12px;border:1px solid transparent;border-radius:2px;font-size:9px}
.switch a.on{color:var(--ink);border-color:var(--dimmer);background:rgba(242,231,231,.07)}
@media(max-width:1040px){.switch{display:flex}}

/* ---- masthead ---- */
.mast{padding:clamp(56px,11vh,132px) var(--pad) clamp(28px,5vh,52px);max-width:1500px;margin:0 auto}
.mast .code{font-size:10px;letter-spacing:.2em;color:var(--rose)}
.mast h1{font-family:var(--serif);font-size:clamp(46px,9.4vw,138px);font-weight:300;
  letter-spacing:-.012em;line-height:.9;margin:18px 0 0}
.mast .sub{font-size:clamp(15px,1.5vw,20px);line-height:1.68;color:var(--dim);
  max-width:52ch;margin-top:26px;font-weight:300}
/* the line that names the change of language — a rose rule, then the fact */
.mast .shift{margin-top:26px;padding-left:16px;border-left:2px solid var(--rose);
  font-family:var(--serif);font-style:italic;font-weight:300;
  font-size:clamp(16px,1.6vw,21px);line-height:1.4;color:var(--ink);max-width:40ch}

/* ---- hero ---- */
.hero{position:relative;margin:clamp(20px,4vh,44px) 0 0;overflow:hidden;background:var(--frame)}
.hero img{display:block;width:100%;height:clamp(320px,64vh,760px);object-fit:cover}
.hero .cap{position:absolute;left:var(--pad);bottom:22px;right:var(--pad);
  font-size:10px;color:rgba(242,231,231,.92);text-shadow:0 2px 24px rgba(0,0,0,.9)}
.hero::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(transparent 55%,rgba(28,27,27,.78))}

/* ---- section rule ---- */
.rule{max-width:1500px;margin:clamp(56px,10vh,116px) auto clamp(22px,4vh,40px);padding:0 var(--pad);
  display:flex;align-items:baseline;gap:18px}
.rule h2{font-family:var(--serif);font-size:clamp(24px,3vw,40px);font-weight:400;
  letter-spacing:-.005em;white-space:nowrap}
.rule i{font-style:normal;font-size:10px;color:var(--rose)}
.rule .ln{flex:1;height:1px;background:var(--dimmer)}

/* ---- concept pieces: alternating editorial ---- */
.piece{max-width:1500px;margin:0 auto clamp(40px,8vh,104px);padding:0 var(--pad);
  display:grid;grid-template-columns:1.32fr 1fr;gap:clamp(24px,4vw,64px);align-items:center;
  opacity:0;transform:translateY(26px);
  transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.piece.in{opacity:1;transform:none}
.piece:nth-child(even) .shot{order:2}
.piece .shot{position:relative;background:var(--frame)}
.piece .shot img{display:block;width:100%;height:auto;cursor:zoom-in}
.piece .shot .n{position:absolute;top:12px;left:12px;font-family:var(--sans);font-weight:500;
  font-size:9px;letter-spacing:.2em;color:var(--blush);background:rgba(28,27,27,.78);padding:5px 9px}
.piece h3{font-family:var(--serif);font-size:clamp(28px,3.6vw,50px);font-weight:400;
  letter-spacing:-.008em;line-height:1.06}
.piece .k{font-size:10px;color:var(--dim);margin-top:13px}
.piece p{font-size:14.5px;line-height:1.72;color:var(--dim);margin-top:18px;max-width:52ch}
.piece blockquote{margin-top:24px;padding-left:18px;border-left:2px solid var(--rose);
  font-family:var(--serif);font-style:italic;font-size:clamp(19px,2vw,27px);font-weight:300;
  line-height:1.35;color:var(--ink);max-width:34ch}
.piece .did{list-style:none;margin-top:24px}
.piece .did li{position:relative;padding-left:20px;margin-bottom:10px;font-size:13px;
  line-height:1.6;color:var(--dim)}
.piece .did li::before{content:'';position:absolute;left:0;top:9px;width:8px;height:1px;background:var(--rose)}
/* both were inline-block, so the frames link and the note tag sat shoulder to
   shoulder on one line and ran into each other */
.piece .tag{margin-top:22px;font-size:9px;color:var(--dim);
  border:1px dashed var(--dimmer);padding:10px 12px;
  display:block;width:fit-content;max-width:100%;line-height:1.7;letter-spacing:.14em}
.piece .more{display:block;width:fit-content;margin-top:16px;font-size:9.5px;
  color:var(--rose);text-decoration:none}
.piece .more:hover{color:var(--ink)}
/* The opening piece has no image of its own — the hero above it is its
   photograph. It runs as a single wide column so the absence reads as a lede
   rather than a missing picture. */
/* A written entry with no photography of its own: title set against its body
   in facing columns, so it holds the page instead of trailing down the left
   third of it. Same measure as a piece that has an image beside it. */
.piece.flat{grid-template-columns:1fr 1.18fr;align-items:start;
  margin-bottom:clamp(36px,6.5vh,80px)}
.piece.flat > div:first-child{padding-top:6px}
.piece.flat .k{margin-top:15px}
.piece.flat p{margin-top:0;max-width:54ch}
@media(max-width:880px){.piece.flat{grid-template-columns:1fr}}
.piece.lede{grid-template-columns:1fr;align-items:start;margin-bottom:clamp(48px,9vh,116px)}
.piece.lede h3{font-size:clamp(34px,5vw,72px)}
.piece.lede p{font-size:clamp(15px,1.5vw,19px);max-width:56ch}
.piece.lede blockquote{font-size:clamp(22px,2.4vw,34px);max-width:40ch}
@media(max-width:880px){
  .piece{grid-template-columns:1fr;gap:22px}
  .piece:nth-child(even) .shot{order:0}
}

/* ---- the blush band ----------------------------------------------------
   The colour break. Section 02 lifts onto Ambrosia's blush ground and the
   type flips to their near-black. Redefining four tokens re-themes every
   component inside it — no duplicated rules. */
.band{background:var(--blush);
  --ink:#1C1B1B;
  --dim:rgba(28,27,27,.62);
  --dimmer:rgba(28,27,27,.18);
  --frame:#FFFFFF;
  color:var(--ink);
  margin-top:clamp(56px,10vh,116px);
  padding:clamp(10px,2vh,26px) 0 clamp(60px,10vh,124px)}
.band .rule{margin-top:clamp(44px,8vh,92px)}

/* ---- board mosaic ---- */
/* the second max-width overrode the first, shrinking the block to 64ch and
   letting margin:auto centre it away from the left margin — the measure now
   lives on the paragraph, the gutter on its wrapper */
.boardwrap{max-width:1500px;margin:0 auto;padding:0 var(--pad)}
.boardlede{max-width:62ch;font-size:15px;line-height:1.72;color:var(--dim)}
.mosaic{max-width:1500px;margin:clamp(22px,4vh,40px) auto 0;padding:0 var(--pad);
  columns:4 250px;column-gap:clamp(10px,1.4vw,18px)}
.mosaic figure{margin:0 0 clamp(10px,1.4vw,18px);break-inside:avoid;position:relative;
  background:var(--frame);opacity:0;transform:translateY(18px);
  transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.mosaic figure.in{opacity:1;transform:none}
.mosaic img{display:block;width:100%;height:auto;cursor:zoom-in}
/* the caption sits over photography, so it stays dark-on-light whatever the band */
.mosaic figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 9px;opacity:0;
  background:linear-gradient(transparent,rgba(28,27,27,.92));transition:opacity .35s ease;
  font-size:9px;letter-spacing:.14em;color:rgba(242,231,231,.72)}
.mosaic figure:hover figcaption{opacity:1}
.mosaic figcaption a{color:var(--blush);text-decoration:none;border-bottom:1px solid rgba(239,220,221,.4)}
.mosaic figcaption a:hover{color:#fff}

/* ---- the board drifts (MWG 083) ---------------------------------------
   .mosaic is the ground state and the fallback. When the drift is on, the
   same figures are lifted out of the column flow onto a pinned stage and
   carried right to left in four lanes. Nothing else about them changes —
   caption, source link and lightbox all still belong to the figure. */
.drift-pin{position:relative}
.mosaic.drift{columns:auto;column-gap:0;height:100vh;position:relative;overflow:hidden;
  max-width:none;margin:0;padding:0}
.mosaic.drift figure{position:absolute;top:0;left:0;margin:0;width:clamp(150px,20vw,340px);
  opacity:1;transform:none;transition:none;will-change:transform}
.mosaic.drift img{display:block;width:100%;height:auto;max-height:38vh;object-fit:cover}
/* the caption is the credit, so it stays legible against photography rather
   than only appearing on hover the way it does in the column layout */
.mosaic.drift figcaption{position:absolute;left:0;right:0;bottom:0;opacity:0;
  padding:18px 8px 7px;background:linear-gradient(transparent,rgba(28,27,27,.88))}
.mosaic.drift figure:hover figcaption{opacity:1}
.drift-cue{max-width:1500px;margin:0 auto;padding:14px var(--pad) 0;
  font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
@media(max-width:768px){
  .mosaic.drift figure{width:clamp(140px,40vw,280px)}
}

/* ---- and Well Given's is a board you push around (MWG 095) -------------
   A grid rather than a runway: every frame sits slightly off square, and the
   one nearest the cursor straightens and comes forward while its neighbours
   give way. .drift and .scatter are alternatives — a board is one or the
   other, never both.

   The stage is padded because the frames genuinely travel: an active frame
   grows to 1.6x and its immediate neighbours are shoved up to 80% of their
   own width away, so without that room the outermost frames would collide
   with the palette above and the rules below. */
.mosaic.scatter{columns:auto;column-gap:0;max-width:1500px;margin:0 auto;
  /* room for the travel, measured not guessed: a neighbour is pushed up to
     80% of its own height (152px at the 190px cap) and the active frame grows
     to 1.6x. Less than this and the top row lands on the palette. */
  padding:clamp(130px,16vh,200px) var(--pad);
  display:grid;grid-template-columns:repeat(5,1fr);place-items:center;
  justify-content:center}
.mosaic.scatter figure{width:clamp(96px,12vw,190px);aspect-ratio:1;margin:0;
  display:flex;align-items:center;justify-content:center;position:relative;
  opacity:1;transform:none;transition:none;will-change:transform;
  /* the mosaic paints --frame behind every figure as a loading ground. Here the
     cell is square and the photograph usually is not, so that ground showed as
     a white card with 40px at the sides and 3px top and bottom — a mount that
     did not line up. The frames sit on the blush with their own shadow, the
     way they do on the drifting board. */
  background:none}
/* contain, not cover: a reference board is other people's compositions and
   cropping them to squares would be editing someone else's photograph */
.mosaic.scatter img{display:block;border-radius:3px;
  box-shadow:0 10px 26px rgba(28,27,27,.16),0 2px 6px rgba(28,27,27,.09)}
.mosaic.scatter img.landscape{width:100%;height:auto}
.mosaic.scatter img.portrait{width:auto;height:100%}
.mosaic.scatter figcaption{position:absolute;left:0;right:0;bottom:0;opacity:0;
  padding:16px 6px 6px;text-align:center;
  background:linear-gradient(transparent,rgba(28,27,27,.88));transition:opacity .25s}
.mosaic.scatter figure:hover figcaption{opacity:1}
@media(orientation:portrait){
  .mosaic.scatter{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:768px){
  .mosaic.scatter figure{width:clamp(84px,23vw,150px)}
}

/* ---- palette swatches ---- */
.pal{max-width:1500px;margin:0 auto;padding:clamp(20px,3vh,34px) var(--pad) 0;
  display:flex;flex-wrap:wrap;gap:clamp(14px,2vw,30px)}
.pal div{display:flex;align-items:center;gap:11px}
.pal b{width:38px;height:38px;border-radius:2px;display:block;border:1px solid var(--dimmer)}
.pal span{font-size:9px;letter-spacing:.16em;color:var(--dim)}
.pal span i{display:block;font-style:normal;color:var(--ink);margin-top:3px;letter-spacing:.1em}

/* ---- rules of the board ---- */
.rules{max-width:1500px;margin:clamp(40px,7vh,80px) auto 0;padding:0 var(--pad);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:clamp(18px,3vw,44px)}
.rules div{border-top:1.5px solid var(--ink);padding-top:15px}
.rules b{display:block;font-size:9px;letter-spacing:.2em;color:var(--rose);margin-bottom:10px}
.rules p{font-size:13.5px;line-height:1.68;color:var(--dim)}

/* ---- pager ---- */
.pager{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding:clamp(40px,7vh,80px) var(--pad) 90px;max-width:1500px;margin:0 auto;
  border-top:1px solid var(--dimmer)}
.pager a{font-size:10px;letter-spacing:.16em;color:var(--dim);text-decoration:none;transition:color .3s}
.pager a:hover{color:var(--rose)}

/* ---- lightbox ---- */
#lb{position:fixed;inset:0;z-index:6100;background:rgba(28,27,27,.97);display:none;
  place-items:center;cursor:zoom-out;padding:3vh 3vw}
#lb.on{display:grid}
#lb img{max-width:100%;max-height:94vh;object-fit:contain}
#lb .x{position:fixed;top:20px;right:26px;font-size:10px;color:rgba(242,231,231,.6)}

/* audit 2026-08: uniform 64px outer margin */
@media(max-width:640px){:root{--pad:24px}}
</style>
</head>
<body>

<header class="sitehead"></header>

<section class="mast" id="mast"></section>
<div class="hero" id="hero"></div>

<div class="rule" id="ruleWork"><i id="workNum"></i><h2 id="workTitle"></h2><span class="ln"></span></div>
<div id="pieces"></div>

<div class="band">
  <div class="rule"><i>02</i><h2>The board it gets shot against</h2><span class="ln"></span></div>
  <div class="boardwrap"><p class="boardlede" id="boardLede"></p></div>
  <div class="pal" id="pal"></div>
  <p class="drift-cue" id="driftCue" hidden>Scroll — the board runs</p>
  <div class="drift-pin" id="driftPin"><div class="mosaic" id="mosaic"></div></div>
  <div class="rules" id="rules"></div>
</div>

<nav class="pager" id="pager"></nav>

<div id="lb"><span class="x">Close ✕</span><img alt=""></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="data.js"></script>
<script src="curation.js"></script>
<script src="nav.js"></script>
<script>
(function(){
  /* The drift needs GSAP + ScrollTrigger and a viewer who wants motion. Absent
     either, every line below still runs and the board is the column mosaic it
     has always been. */
  const DRIFT = !!(window.gsap && window.ScrollTrigger)
    && !matchMedia('(prefers-reduced-motion:reduce)').matches
    && innerWidth > 700;
  const W=window.WORK;
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

  /* Two campaigns, one page. The board case carries the reference photography;
     everything else in the section is our own concept work and leads the page.
     Palette: The Usual's three hexes are quoted verbatim in its own summary
     (sampled off the finished statics). Well Given's copy names cream and
     burgundy without hexes — same two values, same campaign system. */
  const CAMPAIGNS={
    usual:{
      /* board motion is a property of the campaign, not of the template:
         the everyday menu runs level, the gifting campaign turns in depth */
      num:'Campaign one', board:'amb-board-usual', other:'wellgiven', motion:'drift',
      workTitle:'The statics and the mood',
      palette:[['#F4EFE8','Paper'],['#564230','Cocoa'],['#4B141E','Burgundy']]
    },
    wellgiven:{
      num:'Campaign two', board:'amb-board-gifting', other:'usual', motion:'scatter',
      workTitle:'The concepts',
      palette:[['#F4EFE8','Cream'],['#4B141E','Burgundy']]
    }
  };

  const q=new URLSearchParams(location.search);
  let key=q.get('c'); if(!CAMPAIGNS[key]) key='usual';
  const CFG=CAMPAIGNS[key];
  const sec=W.sections.find(s=>s.id===key);
  const all=W.cases.filter(c=>c.sec===key);
  const board=all.find(c=>c.id===CFG.board);
  const pieces=all.filter(c=>c.id!==CFG.board);

  document.title=sec.n+' — For Ambrosia';
  window.NAV.mount(key,'<nav class="switch" id="switch"></nav>');

  /* ---- switcher ---- */
  document.getElementById('switch').innerHTML=
    ['usual','wellgiven'].map(k=>{
      const s=W.sections.find(x=>x.id===k);
      return '<a href="campaign.html?c='+k+'"'+(k===key?' class="on"':'')+'>'+esc(s.n)+'</a>';
    }).join('');

  /* ---- masthead ---- */
  /* Naming the change of language is what makes it read as a decision. Without
     this line, walking in from 98's carbon-and-red pages looks like the site
     lost its nerve; with it, the client sees their own identity being used
     deliberately. Kept to their voice: plain, no adjectives, no pitch. */
  document.getElementById('mast').innerHTML=
    '<div class="code">'+esc(CFG.num)+' · Made for Ambrosia</div>'+
    '<h1>'+esc(sec.n)+'</h1>'+
    '<p class="sub">'+esc(sec.d)+'</p>'+
    '<p class="shift">Set in your own palette and typefaces.</p>';

  /* ---- hero ----
     The strongest concept frame opens the page full-bleed. Its case is then
     REMOVED from the alternating pieces below and written out as a lede
     instead — running it in both places showed the same photograph twice,
     a screen and a half apart. */
  const heroCase=pieces.find(c=>(window.CURATION.framesFor(c)||[]).length);
  const rest=pieces.filter(c=>c!==heroCase);
  if(heroCase){
    const f=window.CURATION.framesFor(heroCase)[0];
    document.getElementById('hero').innerHTML=
      '<img src="'+f.src+'" alt="'+esc(heroCase.n)+'">'+
      '<div class="cap">'+esc(heroCase.n)+' — '+esc(heroCase.m||'')+'</div>';
  }else{
    document.getElementById('hero').style.display='none';
  }

  /* ---- concept pieces ---- */
  document.getElementById('workNum').textContent='01';
  document.getElementById('workTitle').textContent=CFG.workTitle;

  /* split in two so a piece with no photography can set its title against its
     body in facing columns, instead of running down the left third of a very
     wide page with nothing opposite it */
  const titleBlock=c=>
    '<h3>'+esc(c.n)+'</h3>'+
    '<div class="k">'+esc(c.k)+'</div>';
  const bodyBlock=(c,fr)=>
    '<p>'+esc(c.s)+'</p>'+
    (c.pull?'<blockquote>'+esc(c.pull)+'</blockquote>':'')+
    (c.did&&c.did.length?'<ul class="did">'+c.did.map(d=>'<li>'+esc(d)+'</li>').join('')+'</ul>':'')+
    (fr.length>1?'<a class="more" href="roll.html?c='+c.id+'">All '+fr.length+' frames ↗</a>':'')+
    (c.note?'<div class="tag">'+esc(c.note)+'</div>':'');
  const copyBlock=(c,fr)=>titleBlock(c)+bodyBlock(c,fr);

  const lede = heroCase
    ? '<article class="piece lede"><div class="txt">'+
      copyBlock(heroCase, window.CURATION.framesFor(heroCase))+'</div></article>'
    : '';

  document.getElementById('pieces').innerHTML = lede + rest.map((c,i)=>{
    const fr=window.CURATION.framesFor(c);
    /* A piece with no photography runs full width. Emitting an empty .shot
       instead left half the grid blank, which reads as a failed image rather
       than a deliberately written entry. */
    if(!fr.length)
      return '<article class="piece flat">'+
        '<div>'+titleBlock(c)+'</div>'+
        '<div>'+bodyBlock(c,fr)+'</div></article>';
    return '<article class="piece">'+
      '<div class="shot"><img loading="lazy" src="'+fr[0].src+'" alt="'+esc(c.n)+'"'+
      (fr[0].w?' width="'+fr[0].w+'" height="'+fr[0].h+'"':'')+'>'+
      '<span class="n">'+String(i+2).padStart(2,'0')+'</span></div>'+
      '<div>'+copyBlock(c,fr)+'</div></article>';
  }).join('');

  /* ---- the board ---- */
  document.getElementById('boardLede').textContent=board?board.s:'';
  document.getElementById('pal').innerHTML=CFG.palette.map(p=>
    '<div><b style="background:'+p[0]+'"></b><span>'+esc(p[1])+'<i>'+p[0]+'</i></span></div>').join('');

  const bf=board?window.CURATION.framesFor(board):[];
  const mos=document.getElementById('mosaic');
  /* The board frames are reference photography at full plate size — one of them
     is 7723x11585, and the drift puts every frame on stage at once. tools/
     build-board-tiles.py writes a 1000px copy per frame; the original stays the
     lightbox's source, and a missing tile falls back to it. */
  const tile=f=>(board && !f.added)
    ? 'boards/'+board.id+'/'+f.key.replace(/\.[a-z0-9]+$/i,'.jpg') : f.src;
  mos.innerHTML=bf.map((f,i)=>
    '<figure><img loading="lazy" src="'+tile(f)+'" data-full="'+esc(f.src)+'" '+
    'onerror="this.onerror=null;this.src=this.dataset.full" alt="Reference '+(i+1)+'">'+
    '<figcaption data-k="'+esc(f.key)+'">'+String(i+1).padStart(2,'0')+'</figcaption></figure>').join('');

  /* Per-frame provenance. sources.json sits next to the frames; over http this
     resolves, and if it ever fails the captions simply stay as numbers. */
  if(board){
    fetch('frames/'+board.id+'/sources.json')
      .then(r=>r.ok?r.json():null)
      .then(list=>{
        if(!list) return;
        const by={}; list.forEach(x=>by[x.f]=x);
        [...mos.querySelectorAll('figcaption')].forEach(cap=>{
          const s=by[cap.dataset.k];
          if(s&&s.pin) cap.innerHTML=cap.textContent+
            ' · <a href="'+esc(s.pin)+'" target="_blank" rel="noopener nofollow">source ↗</a>';
        });
      }).catch(()=>{});
  }

  /* ---- what the board decides ---- */
  const rules=[];
  if(board){
    (board.did||[]).forEach((d,i)=>rules.push(['0'+(i+1),d]));
    if(board.note) rules.push(['Note',board.note]);
  }
  document.getElementById('rules').innerHTML=rules.map(r=>
    '<div><b>'+esc(r[0])+'</b><p>'+esc(r[1])+'</p></div>').join('');

  /* ---- pager ---- */
  const oth=W.sections.find(s=>s.id===CFG.other);
  document.getElementById('pager').innerHTML=
    '<a href="index.html">← All sections</a>'+
    '<a href="folders.html">Chosen case studies</a>'+
    '<a href="campaign.html?c='+CFG.other+'">'+esc(oth.n)+' →</a>';

  /* ---- reveal + lightbox ---- */
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}
  }),{rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('.piece'+(DRIFT?'':',.mosaic figure')).forEach(el=>io.observe(el));

  /* ---- MWG 083: the board, pinned and drifting ------------------------
     Four lanes on power1..power4 easings, so the frames separate as they
     cross instead of travelling as one block. Vertical placement is
     stratified rather than random — the published effect uses Math.random()
     for y, which on a thirteen-frame board regularly stacks three in the
     same band and leaves the top third empty. Each frame gets its own
     horizontal slice and jitters inside it, off a seeded generator so the
     board looks the same on every load and in every screenshot. */
  if(DRIFT && bf.length && CFG.motion==='scatter'){
    /* ---- MWG 095: the board you push around --------------------------
       No pin and no scrub — this one answers the cursor. Each frame is
       thrown off square on load; the nearest one straightens and comes
       forward, the rest are displaced on an inverse-square falloff so the
       push is strong next door and negligible across the grid.

       Offsets are seeded rather than Math.random() for the same reason the
       other two boards are: the scatter should look identical on every load
       and in every screenshot, not reshuffle behind the client's back. */
    const figs=[...mos.querySelectorAll('figure')];
    const pin=document.getElementById('driftPin');
    const cue=document.getElementById('driftCue');
    cue.hidden=false; cue.textContent='Move across the board';
    mos.classList.add('scatter');
    pin.style.height='';                       // a block in the flow, not a runway

    let seed=0; for(const ch of (board.id||'board')) seed=(seed*31+ch.charCodeAt(0))>>>0;
    const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);
    const rest=()=>({xPercent:(rnd()-0.5)*20, yPercent:(rnd()-0.5)*20,
                     rotation:(rnd()-0.5)*30, scale:1.1});
    const EASE='elastic.out(1, 0.75)', DUR=0.8;

    /* portrait and landscape are sized differently, so each frame is told
       which it is — from data.js where we have it, from the file otherwise */
    figs.forEach((fig,i)=>{
      const img=fig.querySelector('img'), f=bf[i];
      const mark=()=>img.classList.add(
        (f&&f.w&&f.h ? f.h>f.w : img.naturalHeight>img.naturalWidth) ? 'portrait':'landscape');
      if(f&&f.w&&f.h) mark();
      else if(img.complete&&img.naturalWidth) mark();
      else img.addEventListener('load',mark,{once:true});
      gsap.set(fig, rest());
    });

    const cols=()=>getComputedStyle(mos).gridTemplateColumns.split(' ').length;
    let active=-1;
    function settle(i){ gsap.to(figs[i],{...rest(),duration:DUR,ease:EASE}); }
    function focus(a){
      const c=cols(), aCol=a%c, aRow=Math.floor(a/c);
      figs.forEach((fig,i)=>{
        if(i===a) return gsap.to(fig,{xPercent:0,yPercent:0,rotation:0,scale:1.6,
                                      duration:DUR,ease:EASE});
        const dx=(i%c)-aCol, dy=Math.floor(i/c)-aRow, d2=dx*dx+dy*dy||1;
        /* 095 throws neighbours 80% of their own width. That is tuned for a
           full-viewport grid that clips at the edges; this board sits inline
           between the palette and the rules, so the throw is eased to 60 —
           enough to read as displacement, not enough to land the top row on
           the swatches above. Verified against both by measurement. */
        gsap.to(fig,{xPercent:60*dx/d2, yPercent:60*dy/d2, duration:DUR, ease:EASE});
      });
    }
    mos.addEventListener('mousemove',e=>{
      let best=-1, bd=Infinity;
      figs.forEach((fig,i)=>{
        const r=fig.getBoundingClientRect();
        const dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
        const d=dx*dx+dy*dy; if(d<bd){ bd=d; best=i; }
      });
      if(best!==-1 && best!==active){ if(active!==-1) settle(active); active=best; focus(best); }
    });
    mos.addEventListener('mouseleave',()=>{
      if(active!==-1) settle(active);
      active=-1;
      figs.forEach(fig=>gsap.to(fig,{...rest(),duration:DUR,ease:EASE}));
    });

  } else if(DRIFT && bf.length){
    const figs=[...mos.querySelectorAll('figure')];
    const pin=document.getElementById('driftPin');
    document.getElementById('driftCue').hidden=false;
    mos.classList.add('drift');

    let seed=0; for(const ch of (board.id||'board')) seed=(seed*31+ch.charCodeAt(0))>>>0;
    const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);

    const strata=figs.map((_,i)=>i);
    for(let i=strata.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [strata[i],strata[j]]=[strata[j],strata[i]]; }
    const bands=figs.map((_,i)=>(strata[i]+0.12+rnd()*0.62)/figs.length);  // its own slice, jittered

    const EASES=['power1.inOut','power2.inOut','power3.inOut','power4.inOut'];
    /* Place in pixels against each frame's own height, not as a percentage of
       the stage: a portrait plate parked at 90% hangs off the bottom edge.
       The frame's ratio comes from data.js, so this is right before the image
       has loaded — and it is recomputed on resize. */
    function place(){
      const stage=mos.clientHeight;
      figs.forEach((fig,i)=>{
        const f=bf[i], w=fig.offsetWidth||1;
        const h=Math.min(w*((f&&f.h?f.h:1)/(f&&f.w?f.w:1)), stage*0.38);
        gsap.set(fig,{ top:Math.round(bands[i]*Math.max(0,stage-h))+'px',
                       zIndex:1+(i%EASES.length) });
      });
    }
    place();
    addEventListener('resize',()=>{ place(); ScrollTrigger.refresh(); });
    EASES.forEach((ease,lane)=>{
      const group=figs.filter((_,i)=>i%EASES.length===lane);
      if(!group.length) return;
      gsap.fromTo(group,{x:()=>innerWidth,xPercent:10},{
        x:0,xPercent:-110,stagger:0.04,ease:ease,
        scrollTrigger:{trigger:pin,start:'top top',end:'bottom bottom',
          scrub:true, ...(lane===0?{pin:mos,pinSpacing:false}:{})}
      });
    });
    /* the runway: enough scroll for the slowest lane to cross, and it grows
       with the board rather than being a fixed 400vh for any size of board */
    pin.style.height=Math.min(420,140+figs.length*14)+'vh';
    ScrollTrigger.refresh();
  }

  const lb=document.getElementById('lb'), lbi=lb.querySelector('img');
  document.body.addEventListener('click',e=>{
    if(e.target.closest('#lb')) { lb.classList.remove('on'); return; }
    if(e.target.closest('a')) return;
    const im=e.target.closest('.piece img, .mosaic img, .hero img');
    if(!im) return;
    lbi.src=im.dataset.full||im.currentSrc||im.src; lb.classList.add('on');
  });
  addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('on');});
})();
</script>
</body>
</html>
