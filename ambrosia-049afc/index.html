<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Ambrosia × 98 — The Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =============================================================
   The entry page — MWG 108, "hover list with flanking media".

   What replaced what: this was an orbiting cloud of five circular
   cards on black. The cloud had a real problem — a card had to be
   hunted before it would say its own name, so the five doors were
   never all legible at once. A list says all five at once, in type,
   and spends the photography on answering "what is in there?" the
   moment the cursor lands on a name.

   Ground is bone #F6F5F2 — the same paper as the folder index and
   the production wheel. The two campaign sections keep Ambrosia's
   dusty rose so the change of language is visible from here.
   ============================================================= */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
*{-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#0E0E10; --bg:#F6F5F2;
  --dim:rgba(14,14,16,.52); --dimmer:rgba(14,14,16,.26);
  --red:#DD3D38; --rose:#B5677A;
  --mono:"Space Mono",ui-monospace,Menlo,monospace;
  --sans:"Archivo",-apple-system,"Helvetica Neue",sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}

/* ---- the corners ------------------------------------------------------- */
.hud{position:fixed;z-index:40;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);line-height:1.8}
#tl{top:24px;left:26px}
#tr{top:24px;right:26px;text-align:right}
#tr i{font-style:normal;color:var(--ink)}
#hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:40;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dimmer);transition:opacity .6s ease;white-space:nowrap}
#hint.off{opacity:0}

/* ---- the entry ---------------------------------------------------------- */
.entry{position:relative;height:100%;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.mark{display:block;margin-bottom:clamp(18px,3.4vh,34px)}
.mark img{height:34px;display:block}
/* the kicker is on the locked scale — 13px, +.12em — like every other
   kicker on the site */
.kicker{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);margin-bottom:clamp(20px,4vh,44px)}

.lines{list-style:none;display:flex;flex-direction:column;align-items:center;width:100%}
.lines li{display:flex;width:100%;justify-content:center}
/* Display type, and deliberately not the 48/52 the reading pages are locked
   to: this is a poster, not a document. Everything else here — kicker, counts,
   corners — stays on the locked scale, so the exception is the one line that
   is supposed to behave like a headline. */
.lines a{display:block;line-height:1.24;text-decoration:none;color:var(--ink);
  font-size:clamp(38px,4.6vw,68px);font-weight:800;letter-spacing:-.03em;
  padding:.06em .1em;position:relative;
  transition:opacity .3s ease,color .3s ease}
.lines a i{font-style:normal;font-family:var(--mono);font-size:13px;font-weight:400;
  letter-spacing:.12em;color:var(--dimmer);vertical-align:.72em;margin-left:14px}
/* the two sections set in Ambrosia's identity carry their rose, here as
   everywhere else */
.lines a.amb i{color:var(--rose)}
.lines a:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
/* while one name is hovered the others step back — the list behaves like the
   gallery slats do, one thing in focus at a time */
.lines.hot a{opacity:.34}
.lines.hot a.on{opacity:1}
.lines a.on::after{content:'';position:absolute;left:.1em;right:.1em;bottom:.12em;height:2px;
  background:var(--red);transform-origin:left;animation:rule .45s cubic-bezier(.2,.7,.2,1)}
.lines a.amb.on::after{background:var(--rose)}
@keyframes rule{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---- the flanking media ------------------------------------------------- */
.medias{position:absolute;inset:0;z-index:2;visibility:hidden;opacity:0;pointer-events:none}
.media{position:absolute;top:0;left:0;width:8vw;aspect-ratio:1;visibility:hidden;
  pointer-events:none;will-change:transform}
/* the inner tiles sit above the outer ones, so a fan reads as depth */
.media:nth-child(8){z-index:1}.media:nth-child(7){z-index:2}
.media:nth-child(6){z-index:3}.media:nth-child(5){z-index:4}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
  border-radius:2px;background:#F6F5F2;
  box-shadow:0 10px 26px rgba(14,14,16,.14),0 2px 6px rgba(14,14,16,.07)}

/* ---- loader ------------------------------------------------------------- */
#load{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;
  transition:opacity .8s ease .1s,visibility .8s ease .1s}
#load.off{opacity:0;visibility:hidden}
#pct{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--dim)}

/* ---- the phone gets a list, not a fan ----------------------------------
   The effect is a cursor instrument: it needs a pointer position to decide
   how the fan splits left and right. Rather than fake that with a scrub,
   small screens get the same five doors as plain stacked cards. */
#m{display:none;padding:88px 24px 64px;overflow-y:auto;height:100%}
#m a{display:block;text-decoration:none;color:inherit;border-top:1px solid var(--dimmer);
  padding:22px 0}
#m a:last-child{border-bottom:1px solid var(--dimmer)}
#m .n{font-size:30px;font-weight:800;letter-spacing:-.03em}
#m .n i{font-style:normal;font-family:var(--mono);font-size:13px;font-weight:400;
  letter-spacing:.12em;color:var(--dimmer);margin-left:10px;vertical-align:.5em}
#m a.amb .n i{color:var(--rose)}
#m .d{font-size:17px;line-height:28px;color:var(--dim);margin-top:8px;max-width:52ch}
#m .s{display:flex;gap:6px;margin-top:14px}
#m .s img{width:74px;height:74px;object-fit:cover;border-radius:2px;background:#F6F5F2}

@media (max-width:820px){
  html,body{overflow:hidden}
  .entry,#hint{display:none}
  #m{display:block}
  #tr{display:none}
}
@media (prefers-reduced-motion:reduce){
  .lines a.on::after{animation:none}
}
</style>
</head>
<body>

<div id="tl" class="hud">Ninety-Eight<br>Entertainment</div>
<div id="tr" class="hud">Prepared for <i>Ambrosia</i><br>August 2026</div>

<section class="entry" id="entry">
  <span class="mark"><img src="logo98.png" alt="Ninety-Eight Entertainment"></span>
  <p class="kicker">The work</p>
  <ul class="lines" id="lines"></ul>
  <div class="medias" id="medias"></div>
</section>

<div id="hint">Hover a section to see inside · click to enter</div>

<main id="m"></main>

<div id="load"><div id="pct">0%</div></div>

<script src="data.js"></script>
<script src="nav.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  const W = window.WORK, SECTIONS = W.sections;
  const TILES = 16;                       // 8 per side — the zone maths below is tuned to it
  const tile = (sec,i) => 'home/'+sec+'-'+String(i+1).padStart(2,'0')+'.jpg';
  const count = id => W.cases.filter(c=>c.sec===id).length;

  /* ---- the list: five doors, said out loud ---- */
  const list = document.getElementById('lines');
  SECTIONS.forEach(s=>{
    const li=document.createElement('li');
    const a=document.createElement('a');
    a.href = window.NAV.href(s.id);
    a.innerHTML = s.n + '<i>' + count(s.id) + '</i>';
    if(window.NAV.isClient(s.id)) a.className='amb';
    li.appendChild(a); list.appendChild(li);
  });
  const lines = [...list.querySelectorAll('a')].map((a,index)=>({a,index}));

  /* ---- the phone's stacked list (built either way; CSS decides) ---- */
  const m=document.getElementById('m');
  m.innerHTML = SECTIONS.map(s=>
    '<a href="'+window.NAV.href(s.id)+'"'+(window.NAV.isClient(s.id)?' class="amb"':'')+'>'+
      '<div class="n">'+s.n+'<i>'+count(s.id)+'</i></div>'+
      '<div class="d">'+(s.d||'')+'</div>'+
      '<div class="s">'+[0,1,2].map(i=>'<img src="'+tile(s.id,i)+'" alt="" loading="lazy">').join('')+'</div>'+
    '</a>').join('');

  const DESKTOP = matchMedia('(min-width:821px)').matches;
  const REDUCED = matchMedia('(prefers-reduced-motion:reduce)').matches;
  const G = window.gsap;
  const loadEl=document.getElementById('load'), pct=document.getElementById('pct');
  const done=()=>loadEl.classList.add('off');

  /* Without GSAP (CDN down) or on a phone, the list is still the page: five
     real anchors, already rendered. Skip the instrument, keep the doors. */
  if(!DESKTOP || !G || REDUCED){ pct.textContent='100%'; setTimeout(done,250); return; }

  /* ---- media columns: one column per slot, one frame per section ---- */
  const mediasContainer = document.getElementById('medias');
  for(let i=0;i<TILES;i++){
    const col=document.createElement('div'); col.className='media';
    SECTIONS.forEach((s,j)=>{
      const im=document.createElement('img');
      im.alt=''; im.decoding='async';
      im.loading = j===0 ? 'eager' : 'lazy';   // first section up front, rest warmed below
      im.src=tile(s.id,i);
      col.appendChild(im);
    });
    mediasContainer.appendChild(col);
  }
  const medias=[...mediasContainer.querySelectorAll('.media')];
  const half=medias.length/2;

  /* the loader waits only on the first section's row; the other four are
     warmed in the background once the page is up, so a hover is never blank */
  let loaded=0; const first=[...mediasContainer.querySelectorAll('.media img:first-child')];
  const step=()=>{ loaded++; pct.textContent=Math.round(loaded/first.length*100)+'%';
    if(loaded>=first.length){ setTimeout(done,180); warm(); } };
  first.forEach(im=>{ if(im.complete) step(); else { im.onload=step; im.onerror=step; } });
  setTimeout(()=>{ done(); warm(); }, 6000);
  let warmed=false;
  function warm(){ if(warmed) return; warmed=true;
    SECTIONS.slice(1).forEach((s,k)=>setTimeout(()=>{
      for(let i=0;i<TILES;i++){ const im=new Image(); im.src=tile(s.id,i); }
    }, 350*k));
  }

  /* ---- MWG 108's placement, unchanged in shape --------------------------
     The fan is anchored to the hovered line's own box, and how much of it
     falls left versus right is decided by which fifth of the window the
     cursor is in — so the tiles open away from the pointer rather than
     under it. Those two arrays are the effect's tuning; left alone. */
  const FADE={duration:.2,ease:'power1.inOut'};
  const LEFT_INNER=[8,7,6,5,4], RIGHT_INNER=[5,4,3,2,1];
  let zIndex=0, currentZone=2, currentIndex=-1, active=false;
  const hidden=new Array(medias.length).fill(false);
  const root=document.getElementById('entry');

  function positions(el){
    const r=root.getBoundingClientRect(), t=el.getBoundingClientRect();
    const size=medias[0].offsetWidth, gap=innerWidth*.015;
    const li=LEFT_INNER[currentZone], ri=RIGHT_INNER[currentZone];
    const y=t.top-r.top+t.height/2-size/2;
    const slots=medias.map((_,i)=>{
      if(i<half){ const num=i+1, slot=-(li-num+1);
        return {x:(t.left-r.left)+slot*(size+gap), hidden:num>li}; }
      const num=i-half+1, slot=num-ri+1;
      return {x:(t.right-r.left)+gap+(slot-1)*(size+gap), hidden:num<ri};
    });
    return {slots,y};
  }
  function place(el,isLineChange){
    const {slots,y}=positions(el);
    medias.forEach((media,i)=>{
      const s=slots[i];
      const duration=isLineChange? Math.random()/3+.2 : .3;
      const appearing=!s.hidden && hidden[i] && !isLineChange;
      if(s.hidden){
        G.to(media,{scale:0,autoAlpha:0,duration:isLineChange?duration:FADE.duration,
          ease:isLineChange?'back.out(1)':FADE.ease,overwrite:'auto',
          ...(isLineChange&&{x:s.x,y})});
      } else if(appearing){
        G.set(media,{x:s.x,y,overwrite:true});
        G.to(media,{scale:1,autoAlpha:1,...FADE,overwrite:true});
      } else {
        G.to(media,{x:s.x,y,scale:1,duration,ease:'back.out(1)',overwrite:'auto'});
        if(active) G.to(media,{autoAlpha:1,...FADE});
      }
      hidden[i]=s.hidden;
    });
  }
  function show(){ active=true; G.to(mediasContainer,{...FADE,autoAlpha:1}); }
  function hide(){ active=false; G.to(mediasContainer,{...FADE,autoAlpha:0});
    list.classList.remove('hot');
    lines.forEach(l=>l.a.classList.remove('on'));
    currentIndex=-1; }

  function reveal(index){
    if(index===currentIndex) return;
    const el=lines[index].a;
    currentIndex=index; show();
    list.classList.add('hot');
    lines.forEach(l=>l.a.classList.toggle('on', l.index===index));
    zIndex++;
    const on=mediasContainer.querySelectorAll('.media img:nth-child('+(index+1)+')');
    G.fromTo(on,{autoAlpha:0,zIndex:zIndex},{autoAlpha:1,...FADE,onComplete:()=>{
      G.set(mediasContainer.querySelectorAll('.media img:not(:nth-child('+(index+1)+'))'),{autoAlpha:0});
    }});
    place(el,true);
  }
  function zone(clientX,force){
    if(clientX<0||clientX>innerWidth) return;
    const z=Math.min(4,Math.floor(clientX/(innerWidth/5)));
    const changed=z!==currentZone;
    if(changed) currentZone=z;
    if(!changed&&!force) return;
    if(currentIndex>=0) place(lines[currentIndex].a);
  }

  const init=positions(lines[0].a);
  medias.forEach((media,i)=>{ G.set(media,{x:init.slots[i].x,y:init.y,scale:1});
    hidden[i]=init.slots[i].hidden; });

  lines.forEach(({a,index})=>a.addEventListener('mouseenter',()=>reveal(index)));
  list.addEventListener('mouseenter',show);
  list.addEventListener('mouseleave',hide);
  addEventListener('mousemove',e=>zone(e.clientX));
  const hint=document.getElementById('hint');
  addEventListener('mousemove',()=>hint.classList.add('off'),{once:true});
  addEventListener('resize',()=>{ if(currentIndex>=0) place(lines[currentIndex].a); });
})();
</script>
</body>
</html>
